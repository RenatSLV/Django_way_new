<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Добро пожаловать, {{ request.user.username }}!</h1>

    <h2>Ваши группы:</h2>
    <ul>
        {% for group in user_groups %}
            <li>{{ group }}</li>
        {% empty %}
            <li>Вы не состоите ни в одной группе.</li>
        {% endfor %}
    </ul>
</body>
</html>
