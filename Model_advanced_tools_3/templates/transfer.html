{% extends 'base.html' %}

{% block title %}Перевод{% endblock %}

{% block content %}
    <h2>Перевод</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="sender_id">Отправитель:</label>
        <select name="sender_id" required>
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.owner }}</option>
            {% endfor %}
        </select><br>

        <label for="receiver_id">Получатель:</label>
        <select name="receiver_id" required>
            {% for user in users %}
                <option value="{{ user.id }}">{{ user.owner }}</option>
            {% endfor %}
        </select><br>

        <label for="amount">Сумма: </label>
        <input type="number" name="amount", step="0.01" required><br>

        <button type="submit">Перевести</button>
    </form>
{% endblock %}
